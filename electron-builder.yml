# electron-builder configuration for Grasberg Desktop.
# Code signing is intentionally unconfigured — see README "Building installers".
appId: com.grasberg.desktop
productName: Grasberg Desktop

directories:
  output: release

# electron-builder prunes devDependencies from node_modules by default.
files:
  - out/**
  - package.json
  - node_modules/**

asar: true

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  darkModeSupport: true

linux:
  target:
    - AppImage
    - deb
  category: Utility
