# electron-builder configuration for Grasberg Desktop.
# Code signing is intentionally unconfigured — see README "Building installers".
appId: com.grasberg.desktop
productName: Grasberg Desktop

directories:
  output: release

# electron-builder prunes devDependencies from node_modules by default.
files:
  - out/**
  - package.json
  - node_modules/**

# Shipped skill library, seeded into the skills table on first boot.
extraResources:
  - from: resources/bundled-skills
    to: bundled-skills

asar: true

win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  darkModeSupport: true

linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Utility
