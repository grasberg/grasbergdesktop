# electron-builder configuration for Grasberg.
# Code signing is intentionally unconfigured — see README "Building installers".
appId: com.grasberg.app
productName: Grasberg

directories:
  output: release

# electron-builder prunes devDependencies from node_modules by default.
files:
  - out/**
  - package.json
  - node_modules/**

# Shipped skill library, seeded into the skills table on first boot.
extraResources:
  - from: resources/bundled-skills
    to: bundled-skills

asar: true

# tesseract.js spawns a worker_thread whose script cannot reliably load from
# inside app.asar; pdfjs-dist needs no unpack (plain module load, fake worker).
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**

win:
  icon: build/icon.ico
  target:
    - nsis

# Dash-separated artifact names (no spaces) matching the website's download
# URLs: Grasberg-Setup-1.0.0.exe, Grasberg-1.0.0.dmg, Grasberg-1.0.0.AppImage.
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

mac:
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  darkModeSupport: true

linux:
  icon: build/icon.png
  artifactName: ${productName}-${version}.${ext}
  target:
    - AppImage
    - deb
  category: Utility
